<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Completar Compra</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cliente.css">
</head>
<body>
    <header class="cabecera-cliente">
        <div class="logo-contenedor">
            <h1>Finalizar Compra</h1>
        </div>
        <nav>
            <a href="carrito.html">⬅ Volver al Carrito</a>
        </nav>
    </header>

    <main style="padding: 40px 20px; max-width: 600px; margin: 0 auto;">
        <h3 class="titulo-seccion">Datos de Envío y Pago</h3>
        
        <form id="formulario-checkout" style="display: flex; flex-direction: column; gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 8px; border: 1px solid #ddd;">
            
            <label>Nombre Completo:</label>
            <input type="text" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            
            <label>Dirección de Envío:</label>
            <input type="text" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">
            
            <label>Tarjeta de Crédito (Simulación):</label>
            <input type="text" placeholder="XXXX-XXXX-XXXX-XXXX" required style="padding: 10px; border-radius: 4px; border: 1px solid #ccc;">

            <button type="submit" style="background-color: #28a745; color: white; padding: 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; font-size: 16px; margin-top: 10px;">
                Confirmar y Pagar
            </button>
        </form>
    </main>

    <script src="js/checkout.js"></script>
</body>
</html>
