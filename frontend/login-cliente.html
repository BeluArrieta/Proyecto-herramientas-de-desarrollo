<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Cliente</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/cliente.css">
</head>
<body style="background-color: #f4f4f4;">
    <header class="cabecera-cliente" style="background-color: #333;">
        <div class="logo-contenedor">
            <h1>Acceso Clientes</h1>
        </div>
        <nav>
            <a href="index.html">⬅ Volver a la Tienda</a>
        </nav>
    </header>

    <main style="padding: 60px 20px; max-width: 400px; margin: 0 auto;">
        <form id="formulario-login" style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 15px;">
            <h2 style="text-align: center; margin-bottom: 20px;">Iniciar Sesión</h2>
            
            <label>Correo Electrónico:</label>
            <input type="email" id="email" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <label>Contraseña:</label>
            <input type="password" id="password" required style="padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            
            <button type="submit" style="background-color: #0071e3; color: white; padding: 12px; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; margin-top: 10px;">
                Entrar
            </button>
        </form>
    </main>

    <script src="js/login-cliente.js"></script>
</body>
</html>
