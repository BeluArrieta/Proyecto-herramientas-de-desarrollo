<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="login.html">Tiendas</a>
    <div class="nav-links"><a href="registro.html">Crear tienda</a></div>
  </nav>

  <main class="page narrow">
    <header class="head">
      <h1>Bienvenido.</h1>
      <p>Inicia sesión para administrar tu tienda.</p>
    </header>

    <form class="form" id="login-form" novalidate>
      <div class="field">
        <label for="usuario">Usuario o correo</label>
        <input id="usuario" type="text" autocomplete="username" placeholder="tu@correo.com">
        <span class="error" role="alert"></span>
      </div>
      <div class="field">
        <label for="clave">Contraseña</label>
        <input id="clave" type="password" autocomplete="current-password">
        <span class="error" role="alert"></span>
      </div>
      <button class="btn block" type="submit">Entrar</button>
      <p class="small muted">¿Sin tienda todavía? <a href="registro.html">Crea una</a></p>
    </form>
  </main>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
