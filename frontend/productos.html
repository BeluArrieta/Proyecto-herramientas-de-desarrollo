<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Productos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/productos.css">
</head>
<body data-panel>
  <nav class="nav">
    <a class="nav-brand" href="marca.html">Tienda</a>
    <div class="nav-links">
      <a href="marca.html">Marca</a>
      <a href="productos.html" aria-current="page">Productos</a>
      <a href="#" id="salir">Salir</a>
    </div>
  </nav>

  <main class="page">
    <header class="head top">
      <div>
        <h1>Productos.</h1>
        <p>Crea, edita y controla tu inventario.</p>
      </div>
      <button class="btn" id="nuevo" type="button">Nuevo producto</button>
    </header>

    <!-- ALERTA DE STOCK BAJO (pantalla 5) -->
    <section class="alerta section" id="alerta" hidden aria-live="polite">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2 1 21h22L12 2Zm1 15h-2v-2h2v2Zm0-4h-2V9h2v4Z"/></svg>
      <div class="alerta-txt"><b id="alertaTitulo"></b><span id="alertaLista" class="small"></span></div>
      <div class="umbral">
        <label for="umbral" class="small">Avisar con menos de</label>
        <input id="umbral" type="number" min="0" step="1">
        <button class="btn small ghost" id="soloBajo" type="button" aria-pressed="false">Ver solo estos</button>
      </div>
    </section>
    <div class="umbral solo" id="umbralSolo" hidden>
      <label for="umbral2" class="small muted">Umbral de stock bajo</label>
      <input id="umbral2" type="number" min="0" step="1">
    </div>

    <section class="section lista" id="lista" aria-label="Lista de productos"></section>
  </main>

  <!-- Modal crear/editar -->
  <dialog id="dlg">
    <form method="dialog" id="pform" class="form" novalidate>
      <h1 id="dlgTitulo">Nuevo producto</h1>
      <div class="field"><label for="f-nombre">Nombre</label><input id="f-nombre" type="text"><span class="error"></span></div>
      <div class="field"><label for="f-categoria">Categoría</label><input id="f-categoria" type="text" list="cats"><datalist id="cats"></datalist><span class="error"></span></div>
      <div class="row2">
        <div class="field"><label for="f-precio">Precio</label><input id="f-precio" type="number" min="0" step="0.01"><span class="error"></span></div>
        <div class="field"><label for="f-stock">Stock</label><input id="f-stock" type="number" min="0" step="1"><span class="error"></span></div>
      </div>
      <div class="actions">
        <button class="btn" type="submit">Guardar</button>
        <button class="btn ghost" type="button" id="cancelar">Cancelar</button>
      </div>
    </form>
  </dialog>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/productos.js"></script>
</body>
</html>
