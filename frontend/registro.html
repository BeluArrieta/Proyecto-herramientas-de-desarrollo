<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/registro.css">
</head>
<body>
  <nav class="nav">
    <a class="nav-brand" href="login.html">Tiendas</a>
    <div class="nav-links"><a href="login.html">Iniciar sesión</a></div>
  </nav>

  <main class="page narrow">
    <header class="head">
      <h1>Abre tu tienda.</h1>
      <p>Tres datos y estás dentro. Podrás cambiarlos después.</p>
    </header>

    <form class="form" id="registro-form" novalidate>
      <div class="field">
        <label for="nombre">Nombre de la tienda</label>
        <input id="nombre" type="text" placeholder="Mi Tienda" autocomplete="organization">
        <span class="error" role="alert"></span>
      </div>
      <div class="field">
        <label for="rubro">Rubro</label>
        <select id="rubro">
          <option value="">Selecciona un rubro</option>
          <option value="moda">Moda</option>
          <option value="comida">Comida</option>
          <option value="tecnologia">Tecnología</option>
          <option value="salud">Salud y belleza</option>
          <option value="hogar">Hogar y decoración</option>
          <option value="deportes">Deportes</option>
          <option value="juguetes">Juguetes</option>
          <option value="libros">Libros y papelería</option>
          <option value="otro">Otro</option>
        </select>
        <span class="error" role="alert"></span>
      </div>
      <div class="field">
        <label for="slug">Dirección de tu tienda</label>
        <div class="slug-row"><span class="muted">tienda.com/</span><input id="slug" type="text" placeholder="mi-tienda" autocapitalize="off"></div>
        <span class="hint">Se genera desde el nombre. Puedes editarla.</span>
        <span class="error" role="alert"></span>
      </div>
      <button class="btn block" type="submit">Crear tienda</button>
    </form>
  </main>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
