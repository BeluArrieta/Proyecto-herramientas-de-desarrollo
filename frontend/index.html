<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de la Tienda</title>
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/productos.css">
</head>
<body style="background-color: #f9f9f9; margin: 0; font-family: sans-serif;">
    
    <!-- Cabecera dinámica -->
    <header id="cabecera-tienda" style="padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <div>
            <img id="logo-tienda" src="" alt="Logo" style="display: none; max-height: 50px;">
            <h1 id="nombre-tienda" style="margin: 0;">Cargando...</h1>
        </div>
        <nav>
            <a href="carrito.html" style="color: white; text-decoration: none; margin-right: 20px; font-weight: bold;">🛒 Carrito (<span id="contador-carrito">0</span>)</a>
            <a href="login-cliente.html" style="color: white; text-decoration: none; font-weight: bold;">👤 Iniciar Sesión</a>
        </nav>
    </header>

    <!-- Contenedor del catálogo -->
    <main style="padding: 40px 20px; max-width: 1200px; margin: 0 auto;">
        <h2 style="text-align: center; margin-bottom: 30px;">Nuestro Catálogo</h2>
        <!-- Aquí se inyectarán las tarjetas -->
        <div id="contenedor-productos" style="display: flex; gap: 20px; flex-wrap: wrap; justify-content: center;">
        </div>
    </main>

    <!-- Tu script lógico -->
    <script src="js/catalogo.js"></script>
</body>
</html>
