<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Marca de la tienda</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/marca.css">
</head>
<body data-panel>
  <nav class="nav">
    <a class="nav-brand" href="marca.html">Tienda</a>
    <div class="nav-links">
      <a href="marca.html" aria-current="page">Marca</a>
      <a href="productos.html">Productos</a>
      <a href="#" id="salir">Salir</a>
    </div>
  </nav>

  <main class="page">
    <header class="head">
      <h1>Tu marca.</h1>
      <p>Logo y colores. La vista previa cambia mientras eliges.</p>
    </header>

    <div class="split section">
      <form class="form" id="marca-form" novalidate>
        <div class="field">
          <label for="logoUrl">URL del logo</label>
          <input id="logoUrl" type="url" placeholder="https://...">
          <span class="hint">Pega el enlace de una imagen. Déjalo vacío para usar la inicial.</span>
        </div>
        <div class="colors">
          <div class="field">
            <label for="colorPrimario">Color primario</label>
            <div class="color-row"><input id="colorPrimario" type="color"><code id="hexP"></code></div>
          </div>
          <div class="field">
            <label for="colorSecundario">Color secundario</label>
            <div class="color-row"><input id="colorSecundario" type="color"><code id="hexS"></code></div>
          </div>
        </div>
        <div class="actions">
          <button class="btn" type="submit">Guardar marca</button>
          <button class="btn ghost" type="button" id="reset">Restablecer</button>
        </div>
      </form>

      <!-- Mini mockup: los colores se aplican como custom properties SOLO en este contenedor -->
      <div class="preview" id="preview" aria-label="Vista previa de la tienda">
        <div class="pv-bar"><span class="pv-logo" id="pvLogo"></span><b id="pvNombre"></b><i></i><i></i></div>
        <div class="pv-hero">
          <span class="pv-tag">Nueva colección</span>
          <div class="pv-title">Todo lo que buscas, en un solo lugar.</div>
          <span class="pv-btn">Comprar ahora</span>
        </div>
        <div class="pv-grid"><div></div><div></div><div></div></div>
      </div>
    </div>
  </main>

  <script src="js/store.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/marca.js"></script>
</body>
</html>
